<script>

// ---- редкость определяется самой комбинацией ----
function tier(k){const s=k.slice(2);let run=1,mr=1,as=1,ma=1,ds=1,md=1,pairs=0,cnt={};
 for(let i=0;i<7;i++){cnt[s[i]]=(cnt[s[i]]||0)+1;if(!i)continue;const d=s[i]-s[i-1];
  run=d==0?run+1:1;mr=Math.max(mr,run);if(d==0)pairs++;
  as=d==1?as+1:1;ma=Math.max(ma,as);ds=d==-1?ds+1:1;md=Math.max(md,ds)}
 const mc=Math.max(...Object.values(cnt)),sq=Math.max(ma,md),pal=s==[...s].reverse().join('');
 if(mc==7)return 6;if(mr>=5)return 5;if(mr>=4||sq>=6)return 4;
 if(sq>=5||(mr==3&&mc>=5)||(mr>=3&&pal)||pairs>=3)return 3;
 if(mr==3||pal||sq>=4||pairs>=2)return 2;if(pairs>=1||mc>=3)return 1;return 0}
function ins(run,len){const a=[];while(a.length<len)a.push(dg());const p=rd(len-run.length+1);a.splice(p,run.length,...run);return a.join('')}
function gen(t){const d=dg(),r=(n,x)=>x.repeat(n);let s;
 if(t==6)s=r(7,d);else if(t==5)s=ins(r(5,d),7);else if(t==4)s=rd(2)?ins(r(4,d),7):ins([...Array(6)].map((_,i)=>(+d+i)%10).join(''),7);
 else if(t==3){const c=rd(2);s=c?ins([...Array(5)].map((_,i)=>(+d+i)%10).join(''),7):r(3,d)+dg().repeat(2)+dg()+dg()}
 else if(t==2){const a=dg()+dg()+dg()+dg();s=rd(2)?a+[...a].slice(0,3).reverse().join(''):ins(r(3,d),7)}
 else if(t==1){s=ins(r(2,d),7)}else{do{s=[...Array(7)].map(dg).join('')}while(tier('00'+s)>0)}
 return OPS[rd(OPS.length)]+s}
function pick(){let x=Math.random()*100;for(let i=0;i<7;i++){if((x-=ST[sm][2][i])<0)return i}return 0}

// ---- хранение ----
const LVT=[0,15000,30000,60000,120000,250000,500000,1000000,2500000,5000000,10000000];
const nw=()=>P.coins+P.nums.reduce((a,n)=>a+val(n),0)+(P.ph||[]).reduce((a,p)=>a+p.v,0)+(P.pend?VAL[P.pend.r]:0);

 {const g=await db.collection('gifts').where('to','==',pid).get();for(const d of g.docs){const v=d.data();t+=v.amount||0;await db.doc('gifts/'+v.id).delete()}}if(t){P.coins+=t;toast('Получено +'+fmt(t)+' UZS');await save()}}catch(e){}}

function seedR(sd){let a=sd>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

 <div class="box"><h2>Витрина (до 5)</h2><div class="grid">${P.fav.map(k=>P.nums.find(n=>n.k==k)).filter(Boolean).map(n=>card(n)).join('')||'<small>Отметьте ★ в коллекции</small>'}</div></div>
 <div class="box"><h2>Достижения</h2>${A.map(a=>`<div class="row2"><span>${a[0]}</span><span>${a[1]?'🏅':'🔒'}</span></div>`).join('')}</div>`}
init();
</script></body></html>
