<script>
const R=['Common','Uncommon','Rare','Epic','Legendary','Mythic','SECRET'],RU=['Обычный','Необычный','Редкий','Эпический','Легендарный','Мифический','SECRET'];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const disp=k=>`+998 ${k.slice(0,2)} ${k.slice(2,5)} ${k.slice(5,7)} ${k.slice(7,9)}`;
const rd=n=>Math.floor(Math.random()*n),dg=()=>String(rd(10));
let db=null,pid='local',P,tab='spin',busy=0,mf={r:-1,q:'',s:1},lb='value',tt;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2400)}

// ---- редкость определяется самой комбинацией ----
function tier(k){const s=k.slice(2);let run=1,mr=1,as=1,ma=1,ds=1,md=1,pairs=0,cnt={};
 for(let i=0;i<7;i++){cnt[s[i]]=(cnt[s[i]]||0)+1;if(!i)continue;const d=s[i]-s[i-1];
  run=d==0?run+1:1;mr=Math.max(mr,run);if(d==0)pairs++;
  as=d==1?as+1:1;ma=Math.max(ma,as);ds=d==-1?ds+1:1;md=Math.max(md,ds)}
 const mc=Math.max(...Object.values(cnt)),sq=Math.max(ma,md),pal=s==[...s].reverse().join('');
 if(mc==7)return 6;if(mr>=5)return 5;if(mr>=4||sq>=6)return 4;
 if(sq>=5||(mr==3&&mc>=5)||(mr>=3&&pal)||pairs>=3)return 3;
 if(mr==3||pal||sq>=4||pairs>=2)return 2;if(pairs>=1||mc>=3)return 1;return 0}
function ins(run,len){const a=[];while(a.length<len)a.push(dg());const p=rd(len-run.length+1);a.splice(p,run.length,...run);return a.join('')}
function gen(t){const d=dg(),r=(n,x)=>x.repeat(n);let s;
 if(t==6)s=r(7,d);else if(t==5)s=ins(r(5,d),7);else if(t==4)s=rd(2)?ins(r(4,d),7):ins([...Array(6)].map((_,i)=>(+d+i)%10).join(''),7);
 else if(t==3){const c=rd(2);s=c?ins([...Array(5)].map((_,i)=>(+d+i)%10).join(''),7):r(3,d)+dg().repeat(2)+dg()+dg()}
 else if(t==2){const a=dg()+dg()+dg()+dg();s=rd(2)?a+[...a].slice(0,3).reverse().join(''):ins(r(3,d),7)}
 else if(t==1){s=ins(r(2,d),7)}else{do{s=[...Array(7)].map(dg).join('')}while(tier('00'+s)>0)}
 return OPS[rd(OPS.length)]+s}
function pick(){const o=ST[sm][2].map((v,i)=>v*(luckOn()&&i>=2?2:1)),t=o.reduce((a,b)=>a+b,0);let x=Math.random()*t;for(let i=0;i<7;i++){if((x-=o[i])<0)return i}return 0}

// ---- хранение ----
const LVT=[0,15000,30000,60000,120000,250000,500000,1000000,2500000,5000000,10000000];
const nw=()=>P.coins+P.nums.reduce((a,n)=>a+val(n),0)+(P.ph||[]).reduce((a,p)=>a+p.v,0)+(P.pend?VAL[P.pend.r]:0);
const lvOf=()=>{const w=nw();if(w>(P.peak||0))P.peak=w;return LVT.filter(t=>(P.peak||0)>=t).length-1};
const lvName=()=>LV[Math.min(5,Math.floor(lvOf()/2))];
async function save(){P.value=P.nums.reduce((a,n)=>a+val(n),0);P.id=pid;pubId();P.count=P.nums.length;P.best=P.nums.reduce((a,n)=>Math.max(a,n.r),-1);P.lv=lvOf();
 try{localStorage.setItem('uznt_'+pid,JSON.stringify(P))}catch(e){}
 if(db)try{await db.doc('players/'+pid).set(P)}catch(e){}}
function rstM(){if(P.m.d!==today())P.m={d:today(),spin:0,list:0,rare:0,c:{}}}
async function claimSales(){if(!db)return;try{const q=await db.collection('sales').where('seller','==',pid).get();let t=0;
 for(const d of q.docs){const v=d.data();t+=v.amount;await db.doc('sales/'+v.id).delete()}
 {const g=await db.collection('gifts').where('to','==',pid).get(),gm=[];for(const d of g.docs){const v=d.data();await db.doc('gifts/'+v.id).delete();const m=await applyGift(v);if(m)gm.push(m)}if(gm.length){toast('🎁 Подарок: '+gm.join(' · '));confetti(150);await save()}}if(t){P.coins+=t;toast('Получено +'+fmt(t)+' UZS');await save()}}catch(e){}}
async function init(){
 try{const tg=window.Telegram&&Telegram.WebApp;if(tg&&tg.initData){tg.ready();tg.expand();TGI=tg.initData;const u=tg.initDataUnsafe&&tg.initDataUnsafe.user;if(u)pid='tg'+u.id}}catch(e){}
 try{db=await makeDb()}catch(e){db=null}
 let d=null;
 if(db)try{const s=await db.doc('players/'+pid).get();if(s.exists)d=s.data()}catch(e){}
 if(!d)try{d=JSON.parse(localStorage.getItem('uznt_'+pid))}catch(e){}
 P=JSON.parse(JSON.stringify(d||{name:'Игрок'+(1000+rd(9000)),coins:10000,v2:1,xp:0,nums:[],hist:[],fav:[],daily:'',m:{},joined:today()}));
 if(!P.v2){P.v2=1;P.coins=Math.max(P.coins*100,10000)}rstM();await claimSales();try{await aucSettle()}catch(e){}try{if(db&&STARS)await vipSync(false)}catch(e){}try{const c=localStorage.getItem('uznt_ac');if(c&&await adminCheck(c)){isAdm=true;ADMC=c}}catch(e){}render()}

// ---- UI ----
const card=(n,x='')=>{const o=opOf(n.k);return `<div class="card r${n.r}${n.sp?' sp':''}${n.mod?' mod-'+n.mod:''}" style="background:linear-gradient(135deg,${o[1]}55,#0b1330 75%)"><b>${disp(n.k)}</b><small>${o[0]} · ${RU[n.r]} · ${fmt(val(n))} UZS${n.m>1?' ×'+n.m:''}${n.mod?' · '+MODN[n.mod]:''}</small>${x}${n.sp?`<div class="cap2">★ ${esc(n.sp)}</div>`:''}</div>`};
function go(t){if(t==='rkt'){cgame=3;t='cas'}tab=t;render()}
function render(){if(!P)return;applyBg();{const l=lvOf(),a=LVT[l],b=LVT[l+1]||a;$('#lvp').textContent=(isVip()?'⭐ VIP · ':'')+'Ур. '+l;$('#stp').textContent='🔥 '+(P.streak||0);$('#hb').style.width=(b>a?Math.min(100,((P.peak||0)-a)/(b-a)*100):100)+'%'}$('#bal').textContent='💰 '+fmt(P.coins);
 $('#nav').innerHTML=TABS.map(t=>`<a class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</a>`).join('');
 const m=$('#main');({home:vHome,col:vCol,spin:vSpin,case:vCase,mkt:vMkt,mis:vMis,top:vTop,me:vMe,menu:vMenu,upg:vUpg,hist:vHist,bonus:vBonus,wheel:vWheel,set:vSet,promo:vPromo,adm:vAdm,cas:vCas,auc:vAuc,alb:vAlb,pass:vPass,duel:vDuel,shop:vShop,fly:vFly,tour:vTour,swap:vSwap,blk:vBlk,fr:vFr,clan:vClan,lg:vLg,club:vClub})[tab](m)}
function vHome(m){const l=lvOf(),pk=P.peak||0,a=LVT[l],b=LVT[l+1]||a,v=P.nums.reduce((s,n)=>s+val(n),0);
 m.innerHTML=`${questHtml()}<div class="box hero"><div class="av">${esc(P.name.slice(0,1).toUpperCase())}</div><div style="flex:1"><div class="big">${esc(P.name)}</div><span class="chip">${lvName()} · ур. ${l}</span><div class="cap">💰 ${fmt(P.coins)}</div><small>Капитал ${fmt(pk)}${b>a?' / '+fmt(b)+' до ур. '+(l+1):' · максимум'}</small><div class="bar"><i style="width:${b>a?Math.min(100,(pk-a)/(b-a)*100):100}%"></i></div></div></div>
 <div class="grid"><div class="box"><div class="mu">Стоимость коллекции</div><div class="big">${fmt(v)}</div></div><div class="box"><div class="mu">Номеров</div><div class="big">${P.nums.length}</div></div></div>
 <div class="box"><button class="g" onclick="daily()" ${P.daily==today()?'disabled':''}>🎁 Ежедневный бонус</button> <button onclick="go('spin')">🎰 Открыть номер</button></div>
 <div class="box"><small>Все номера — виртуальные игровые объекты, не связаны с реальными SIM-картами. Валюта только игровая, за реальные деньги ничего не продаётся. ${db?'Онлайн: общая экономика и рынок включены.':'Офлайн-режим: прогресс хранится только в этом браузере, рынок и рейтинг недоступны.'}</small></div>`}
async function daily(){if(P.daily==today())return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);P.streak=P.daily==y?(P.streak||0)+1:1;P.daily=today();const bn=Math.floor(CAL[(P.streak-1)%7]*(isVip()?1.5:1));P.coins+=bn;if(P.streak%30==0)P.coins+=500000;P.xp+=10;confetti(20);await save();toast('+'+bn+' UZS · серия '+P.streak);render()}
function vCol(m){const L=[...P.nums].sort((a,b)=>b.r-a.r);
 m.innerHTML=`<h2>Коллекция (${L.length})</h2>`+upgHtml()+(L.length?`<div class="grid">${L.map(n=>card(n,`<div class="row"><button class="s" onclick="fav('${n.k}')">${P.fav.includes(n.k)?'★':'☆'}</button><button class="s" onclick="askPrice('${n.k}')">На рынок</button><button class="s" onclick="quick('${n.k}')">Продать быстро</button></div>`)).join('')}</div>`:'<div class="box">Пока пусто — крутите SPIN!</div>')}
function fav(k){const i=P.fav.indexOf(k);if(i>=0)P.fav.splice(i,1);else if(P.fav.length<5)P.fav.push(k);else toast('Максимум 5 любимых');save();render()}
function vSpin(m){freeSync();const pd=P.pend,pc=pd?opOf(pd.k)[1]:'';m.innerHTML=`<div class="box" style="text-align:center">${questHtml()}<h2>Number Spin</h2><div class="tabs modes">${ST.map((s,i)=>`<button class="s ${sm==i?'on':''}" onclick="setSm(${i})" style="${lvOf()<s[3]?'opacity:.5':''}">${lvOf()<s[3]?'🔒 ':''}${s[0]}<br>${lvOf()<s[3]?'ур. '+s[3]:fmt(s[1])}</button>`).join('')}</div><div class="${pd?'reel r'+pd.r:'reel'}" id="reel" ${pd?`style="--oc:${pc}" data-op="${opOf(pd.k)[0]}"`:''}>${(pd?disp(pd.k):'+998 ?? ??? ?? ??').split('').map(c=>`<span class="${pd?'fix':''}">${c}</span>`).join('')}</div><div id="res" class="mu">${pd?pendHtml(pd):'Стоимость: '+ST[sm][1]+' UZS · Ваш уровень: '+lvOf()+(sm==0&&P.fs<3?' · бесплатный Spin через '+Math.max(1,Math.ceil((1800000-(Date.now()-P.ft))/60000))+' мин':'')}</div><br><div class="act"><button class="s coll" onclick="go('col')">📱<br>Коллекция</button>${pd?`<button class="g" onclick="sellPend()" style="flex:1">Продать<br>${fmt(val(pd))} UZS</button><button class="s" onclick="keep()" style="flex:1;padding:14px;font-size:16px">Оставить</button>`:`<button class="g" id="sb" onclick="spin()">${sm==0&&freeSync()>0?'🎟 Бесплатный Spin · ещё '+P.fs:'🎰 SPIN · '+fmt(ST[sm][1])+' UZS'}</button>`}</div></div>
 <div class="box"><h2>Шансы (целевые классы)</h2>${ST[sm][2].map((o,i)=>`<div class="row2 r${i}" style="color:var(--c)"><span>${RU[i]}</span><span>${o}%</span></div>`).join('')}<small>Итоговая редкость определяется самой комбинацией цифр. Каждый номер уникален в игре.<br>🎯 Гарантия Mythic: ${P.pity||0}/60 Spin.<br>🏆 Бонус оператора от цены Spin: Ucell 100% · Beeline 75% · Uztelecom 50%. Чем реже номер, тем больше. Любой номер продаётся за полную цену, без комиссии.</small></div>
 <div class="box"><h2>История</h2>${(P.hist||[]).slice(-10).reverse().map(h=>`<div class="row2 r${h.r}"><span>${disp(h.k)}</span><small style="color:var(--c)">${RU[h.r]}</small></div>`).join('')||'<small>Пока нет открытий</small>'}</div>`}
async function spin(){if(busy||P.pend)return;if(lvOf()<ST[sm][3])return toast('Нужен уровень '+ST[sm][3]);const fr=sm==0&&freeSync()>0,cost=fr?0:ST[sm][1];if(P.coins<cost)return toast('Не хватает монет');sfx.start();busy=1;P.coins-=cost;if(fr){P.fs--;if(P.fs==2)P.ft=Date.now()}$('#bal').textContent='💰 '+fmt(P.coins);
 let k;for(let i=0;i<8;i++){k=gen(force||(P.pity||0)>=59?5:pick());if(!db)break;try{const s=await db.doc('owned/'+k).get();if(!s.exists)break}catch(e){break}}
 force=0;const r=tier(k);P.pity=r>=5?0:(P.pity||0)+1;if(db)try{await db.doc('owned/'+k).set({owner:pid,r})}catch(e){}
 const rl=$('#reel'),txt=disp(k),sp=[...rl.children];$('#sb').disabled=true;$('#res').textContent='…';
 let tk=0;const iv=setInterval(()=>{if(++tk%2==0)sfx.tick();sp.forEach((s,j)=>{if(j>4&&!s.classList.contains('fix')&&/\d|\?/.test(s.textContent))s.textContent=dg()})},60);
 rl.className='reel r'+r;rl.style.cssText=`--oc:${opOf(k)[1]}`;rl.dataset.op=opOf(k)[0];let i=5;const dly=r>=4?260:130;
 setTimeout(function step(){while(i<txt.length&&!/\d/.test(txt[i])){sp[i].textContent=txt[i];sp[i].classList.add('fix');i++}
  if(i>=txt.length){clearInterval(iv);fin();return}sp[i].textContent=txt[i];sp[i].classList.add('fix');sfx.reveal(i);i++;setTimeout(step,dly)},1000);
 async function fin(){P.pend={k,r};{const u=Math.random();if(u<.01){P.pend.m=5;P.pend.mod='autograph'}else if(u<.04){P.pend.m=3;P.pend.mod='holo'}else if(u<.12){P.pend.m=2;P.pend.mod='gold'}}if(huntOk(k)&&P.hunt!==today()){P.hunt=today();P.coins+=25000;toast('🎯 Охота выполнена! +25 000 UZS')}const bn=opBonus(k,r,cost);P.coins+=bn;celebrate(r);if(!$('#res')){busy=0;await save();render();return}P.hist=(P.hist||[]).concat({k,r}).slice(-30);P.xp+=5+r*10;rstM();P.m.spin++;if(r>=2)P.m.rare++;
  busy=0;await save();$('#bal').textContent='💰 '+fmt(P.coins);render()}}

// ---- маркетплейс ----
function askPrice(k){if(isLk(k))return toast('Номер заблокирован 🔒');if(!db)return toast('Рынок доступен только онлайн');const n=P.nums.find(x=>x.k==k);

async function openCase(i){if(busy)return;const c=CS[i];if(P.coins<c[1])return toast('Не хватает монет');busy=1;P.coins-=c[1];$('#bal').textContent='💰 '+fmt(P.coins);
 let x=Math.random()*100,t=3;for(let j=0;j<4;j++){if((x-=c[2][j])<0){t=j;break}}
 const pool=PH[t],h=pool[rd(pool.length)],p={n:h[0],t,v:h[1]},all=PH.flat();
 const iv=setInterval(()=>{const b=$('#cres');if(b)b.innerHTML=`<div class="big mu">📦 ${esc(all[rd(all.length)][0])}</div>`},70);
 setTimeout(async()=>{clearInterval(iv);P.ph=P.ph||[];const jp=p.v>=1000000;if(jp)P.coins+=p.v;else P.ph.push(p);P.xp+=5+t*10;cr=`<div class="t${t}"><div class="big">${phHtml(p)}</div>${jp?'<b style="color:#4ade80">🎰 ДЖЕКПОТ! +'+fmt(p.v)+' UZS на баланс</b>':(t>=2?'🎉✨':'')}</div>`;busy=0;confetti([60,90,160,400][t]);if(jp)banner('ДЖЕКПОТ!','+'+fmt(p.v)+' UZS','#fbbf24');await save();render()},1500)}
async function sellPh(i){const p=(P.ph||[]).splice(i,1)[0];if(!p)return;P.coins+=p.v;await save();toast('+'+fmt(p.v)+' UZS');render()}
async function sellAllPh(){const t=(P.ph||[]).reduce((a,p)=>a+p.v,0);P.ph=[];P.coins+=t;await save();toast('+'+fmt(t)+' UZS');render()}

 <div class="box"><h2>Достижения</h2>${A.map(a=>`<div class="row2"><span>${a[0]}</span><span>${a[1]?'🏅':'🔒'}</span></div>`).join('')}</div>`}
// ---- Telegram + сервер ----
let TGI='';const ADMIN=''; // ADMIN: ваш Telegram ID цифрами (секретный приём с балансом); пусто = выключено
async function makeDb(){
 if(!TGI)return null;
 const call=async b=>{const r=await fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json','X-Init-Data':TGI,'X-Admin':ADMC},body:JSON.stringify(b)});if(!r.ok)throw new Error(r.status);return r.json()};
 await call({op:'ping'});STARS=true;
 const snap=(p,d)=>({id:p.split('/').pop(),exists:d!=null,data:()=>d});
 const rows=r=>({docs:r.rows.map(d=>({id:d.id||'',data:()=>d}))});
 return{admin:async c=>{ADMC=c;try{await call({op:'admin'});return true}catch(e){ADMC='';return false}},
  doc:p=>({get:async()=>snap(p,(await call({op:'get',path:p})).data),set:d=>call({op:'set',path:p,data:d}),delete:()=>call({op:'del',path:p})}),
  collection:c=>({get:async()=>rows(await call({op:'query',col:c})),where:(f,_,v)=>({get:async()=>rows(await call({op:'query',col:c,f,v}))})})}}
init();
</script></body></html>
